
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        .appbar {
            background-color: #123665;
            color: white;
            padding: 15px 30px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .appbar h2 {
            margin: 0;
            font-size: 22px;
        }

        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            padding: 20px;
        }

        .div1 {
            background-color: #123665;
            color: white;
            padding: 30px;
            width: 300px;
            min-height: 380px;
            border-radius: 15px 0 0 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .div1 h1 {
            font-size: 28px;
        }

        .div1 p {
            line-height: 1.6;
            color: #dbeafe;
        }

        .div2 {
            background-color: white;
            padding: 35px;
            width: 350px;
            min-height: 380px;
            border-radius: 0 15px 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .div2 h2 {
            color: #123665;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 4px rgba(37,99,235,0.3);
        }

        button {
            width: 100%;
            height: 45px;
            background-color: #123665;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #1e4f8a;
        }

        .signup {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .signup:hover {
            text-decoration: underline;
        }

        .messages {
            text-align: center;
            color: #dc2626;
            list-style: none;
            padding: 10px;
        }

        @media (max-width: 650px) {
            .main {
                flex-direction: column;
                padding: 20px;
            }

            .div1 {
                width: 100%;
                min-height: 150px;
                border-radius: 15px 15px 0 0;
            }

            .div2 {
                width: 100%;
                border-radius: 0 0 15px 15px;
            }

            .appbar h2 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <div class="appbar">
        <h2>PUBLIC COMPLAINT MANAGEMENT SYSTEM</h2>
    </div>

    <div class="main">

        <div class="div1">
            <h1>WELCOME!</h1>
            <p>
                Your voice matters. Submit your complaints
                and help us make our community better.
            </p>
        </div>

        <div class="div2">

            <h2>LOGIN PAGE</h2>

            <form action="/myapp/login_add/" method="post">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="user" placeholder="Enter username" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>

                <button type="submit">Login</button>
            </form>

            <a class="signup" href="/myapp/citizensignup_view/">
                New citizen? Create an account
            </a>

        </div>

    </div>

</body>
</html>
